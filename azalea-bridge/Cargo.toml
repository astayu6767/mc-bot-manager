[package]
name = "azalea-bridge"
version = "0.1.0"
edition = "2021"
description = "JSON-lines sidecar that drives an Azalea (Rust) Minecraft client for MC Bot Manager"

[dependencies]
# Use latest git main which has fixes for newer Rust nightly (FixedBitSet E0284)
# Previously pinned to 0.16.0 which broke with nightly 2025+
azalea = { git = "https://github.com/azalea-rs/azalea", branch = "main", default-features = true }
azalea-auth = { git = "https://github.com/azalea-rs/azalea", branch = "main" }
eyre = "0.6"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde"] }

[profile.release]
lto = false
codegen-units = 8
opt-level = 3
debug = false
strip = true
