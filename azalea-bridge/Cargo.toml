[package]
name = "azalea-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
# Use git main - it has edition2024 support AND E0284 fix
azalea = { git = "https://github.com/azalea-rs/azalea", branch = "main" }
azalea-auth = { git = "https://github.com/azalea-rs/azalea", branch = "main" }
eyre = "0.6"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde"] }

[profile.release]
lto = false
codegen-units = 8
opt-level = 3
